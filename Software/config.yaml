# RDRS Configuration
# All runtime-tunable values live here. Never hardcode these in source files.
# Restart the application for changes to take effect.

monitoring:
  # Directories to watch for entropy analysis.
  # These are also passed to the file monitor as the canonical monitored paths.
  # At minimum, include the user's home directory or any sensitive data folders.
  directories:
    - 'C:\RDRS_Test'

  # Desktop file monitor root selected from the Startup Dashboard.
  # This can be different from the entropy-monitoring directory.
  file_monitor_directory: 'C:\RDRS_Test'

  # File extensions that the entropy module will scan.
  # Extensions must be lowercase, without a leading dot.
  file_extensions:
    - doc
    - docx
    - xls
    - xlsx
    - ppt
    - pptx
    - pdf
    - txt
    - csv
    - jpg
    - jpeg
    - png
    - zip
    - py
    - js
    - ts
    - html
    - xml
    - json
    - db
    - sqlite
    - sqlite3

entropy:
  # How many bytes of each file are read for entropy calculation.
  # Ransomware typically encrypts the full file, so the first 5 MB
  # is a sufficient and performant sample.  Reducing this value speeds
  # up scanning but may miss partial-encryption patterns.
  sample_size_mb: 5

  # Minimum entropy increase (bits) between two scans that is treated as
  # suspicious.
  #
  # Rationale:
  #   - Plaintext English/source files typically have entropy 3.5–5.0 bits/byte.
  #   - Encrypted or compressed data approaches 7.5–8.0 bits/byte.
  #   - A legitimate "save" of a Word document rarely changes entropy by > 0.5.
  #   - Modern ransomware (LockBit, BlackCat, Conti) typically jumps entropy
  #     from ~4.5 to ~7.8 after encryption — a delta of ~3.3.
  #   - Setting the threshold at 1.4 bits provides a comfortable margin above
  #     normal compression/format changes while catching early-stage encryption.
  #   Reference: "Entropy-Based Detection of Ransomware" (NDSS 2019);
  #              Continella et al., "ShieldFS" (ACSAC 2016).
  threshold: 1.4

  # Score delta the Engine awards when EntropyIncreaseDetected fires.
  # This value is READ by the Engine / detection_engine.py — the entropy module
  # itself never modifies scores.
  score: 30

  # Master on/off switch for the entropy-increase scoring rule. Edited from
  # the GUI's "Active Rules" page alongside the other behavioral rules.
  enabled: true

database:
  # File names only — the application resolves the full path to a platform-
  # appropriate writable directory (e.g. ~/Library/Application Support/RDRS/).
  # Do NOT put absolute paths here.
  metadata_db: metadata.db
  logs_db:     logs.db
  alerts_db:   alerts.db

  # Deleted file records are kept for this many days before being purged.
  metadata_retention_days: 30

  # Maximum rows in the logs table.  When exceeded, the oldest rows are
  # deleted in bulk.  500 000 rows is roughly 200–400 MB depending on
  # event verbosity.
  max_log_rows: 500000

alerts:
  # A process score at or above this value triggers the red alert banner
  # on the Home page and plays a notification sound.
  process_alert_threshold: 70

detection:
  # File Extension Change ("Rule4_ExtensionChangeBurst") burst detection.
  #
  # Ransomware renames files after encrypting them (e.g. report.docx ->
  # report.locked). A single genuine rename is common and benign; a BURST
  # of renames from the same process in a short window is not.
  #
  # If a process performs more than `extension_change_threshold` genuine
  # extension changes within `extension_change_window_seconds`, the rule
  # activates and its weight (see rule_weights below) is added to that
  # process's score for as long as the burst continues. The bonus is
  # removed automatically once the burst subsides (old events fall outside
  # the window), so it is never double-counted for the same burst.
  extension_change_threshold: 5
  extension_change_window_seconds: 10

  # Score contributed by each behavioral rule while active. Rule4 is the
  # File Extension Change Monitor's burst rule.
  rule_weights:
    Rule1_FileBurst: 20
    Rule2_MultipleDirectories: 30
    Rule3_YoungProcessBurst: 20
    Rule4_ExtensionChangeBurst: 35

  # Per-rule enable/disable switches. A disabled rule never contributes to
  # a process's score, even if its trigger condition holds. Edited from the
  # "Active Rules" GUI page — changes here are written back automatically.
  rule_enabled:
    Rule1_FileBurst: true
    Rule2_MultipleDirectories: true
    Rule3_YoungProcessBurst: true
    Rule4_ExtensionChangeBurst: true

extension_monitor:
  # Master on/off switch for the File Extension Change Monitor.
  enabled: true

  # Destination extensions treated as benign churn (autosave/temp files,
  # partial downloads, editor swap files) and therefore never counted as a
  # "genuine" extension change, even though the suffix technically differs.
  ignored_extensions:
    - tmp
    - temp
    - swp
    - swx
    - swo
    - bak
    - crdownload
    - part
    - partial
    - download
